                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: cluster-prometheus-datasource
                  query: 'avg(DCGM_FI_PROF_DRAM_ACTIVE and on(exported_pod) label_replace((count by (pod)(vllm:cache_config_info{model_name=~"$model_name"}) OR group by (pod)(vllm:num_requests_running{model_name=~"$model_name"})), "exported_pod", "$1", "pod", "(.*)"))'
