<text x="1040" y="902" font-size="11" fill="#495057" text-anchor="start">•  otel-collector runs in gateway mode, 2 replicas by default</text>
<text x="1040" y="921" font-size="11" fill="#495057" text-anchor="start">•  Discovery: label monitoring.opendatahub.io/scrape=&quot;true&quot; on Service/PodMonitors</text>
<text x="1040" y="940" font-size="11" fill="#495057" text-anchor="start">•  Metrics and traces retained 90 days by default, configurable</text>
<text x="1040" y="959" font-size="11" fill="#495057" text-anchor="start">•  Thanos Querier fronted by kube-rbac-proxy + prom-label-proxy (namespace-scoped)</text>
<text x="1040" y="978" font-size="11" fill="#495057" text-anchor="start">•  Tempo: monolithic mode on PV, microservices mode on object storage</text>
