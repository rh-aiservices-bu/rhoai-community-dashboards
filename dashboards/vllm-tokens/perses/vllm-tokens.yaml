apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: dashboard-9-c-vllm-tokens
  namespace: redhat-ods-monitoring
spec:
  config:
    display:
      name: "[C] - vLLM Token Throughput"
      description: "Output token rate per vLLM model."
    duration: 1h
    variables:
      - kind: ListVariable
        spec:
          name: model
          display:
            name: Model
          allowAllValue: true
          defaultValue: $__all
    panels:
      tokenRate:
        kind: Panel
        spec:
          display:
            name: "Output tokens per second"
          plugin:
            kind: TimeSeriesChart
            spec: {}
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    datasource:
                      kind: PrometheusDatasource
                      name: data-science-prometheus-datasource
                    query: sum(vllm:generation_tokens_total{model_name=~"$model"})
    layouts:
      - kind: Grid
        spec:
          display:
            title: Throughput
          items:
            - content:
                $ref: "#/spec/config/panels/tokenRate"
              x: 0
              y: 0
              width: 12
              height: 8
