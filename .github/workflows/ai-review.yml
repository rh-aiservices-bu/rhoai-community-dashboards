name: ai review

# Advisory review of dashboard and docs changes using RHOAI
# Models-as-a-Service. Never gates a merge.
#
# Uses pull_request, not pull_request_target, on purpose. pull_request_target
# would expose the API key to code from a forked branch. The consequence is
# that pull requests from forks get no secrets, so the job reports that it was
# skipped instead of failing.

on:
  pull_request:
    paths:
      - 'dashboards/**'
      - 'content/**'
      - 'validation/**'
      - '.coderabbit.yaml'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: advisory review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: collect diff
        run: |
          git diff --unified=10 \
            "origin/${{ github.base_ref }}...HEAD" \
            -- dashboards content validation .coderabbit.yaml \
            > pr.diff || true
          printf 'diff bytes: %s\n' "$(wc -c < pr.diff)"

      - name: review
        env:
          MAAS_BASE_URL: ${{ vars.MAAS_BASE_URL }}
          MAAS_MODEL: ${{ vars.MAAS_MODEL }}
          MAAS_API_KEY: ${{ secrets.MAAS_API_KEY }}
        run: |
          {
            printf '<!-- ai-review-marker -->\n'
            printf '## Advisory AI review\n\n'
            ./validation/scripts/ai_review.sh pr.diff
          } > review.md
          cat review.md

      - name: post or update comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          existing=$(gh api "repos/${{ github.repository }}/issues/${PR}/comments" \
            --jq '.[] | select(.body | contains("<!-- ai-review-marker -->")) | .id' \
            | head -1)
          if [ -n "$existing" ]; then
            gh api -X PATCH \
              "repos/${{ github.repository }}/issues/comments/${existing}" \
              -F body=@review.md >/dev/null
            printf 'updated comment %s\n' "$existing"
          else
            gh pr comment "$PR" --body-file review.md
            printf 'created new comment\n'
          fi
