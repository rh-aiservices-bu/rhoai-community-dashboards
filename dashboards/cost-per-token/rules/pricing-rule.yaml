---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: api-pricing-table
  namespace: redhat-ods-monitoring
  labels:
    openshift.io/prometheus-rule-evaluation-scope: leaf-prometheus
spec:
  groups:
    - name: api-pricing-table
      rules:
        # Constant price series consumed by the [C] - Cost per Token Perses
        # dashboard (dashboard-99-cost-per-token-admin).
        # Materialized here (instead of hardcoding prices in dashboard PromQL)
        # so the `pair` label (provider/model) drives the dashboard's single
        # API-model dropdown.
        # Tested against OCP 4.22 / RHOAI 3.5. The rule ships into
        # redhat-ods-monitoring, which carries
        # openshift.io/cluster-monitoring=true, so the platform Prometheus
        # evaluates it and the recorded series flow to the central Thanos
        # Querier, which the dashboard's `cluster-prometheus-datasource`
        # queries. Clusters preferring user-workload evaluation may instead
        # apply the rule to a UWM-scraped workload namespace, where UWM's
        # enforcedNamespaceLabel adds a `namespace` label to every pricing
        # series.
        #
        # token_type normalization across providers:
        #   input, output, cache_read, cache_write (5m TTL), cache_write_1h
        # context: "any" for Anthropic (except haiku-5.5, which uses
        #          prompt-length pricing); "short" / "long" for OpenAI
        #          (<=272K input) and haiku-5.5 (<=100K / >100K input).
        # A capability the provider does not offer for a model (shown as "-"
        # on their pricing page) gets no series at all; the dashboard falls
        # back to the input price for cache reads on such models.
        #
        # Prices as of 2026-11-12
        # Sources: https://docs.claude.com/en/docs/about-claude/pricing
        #          https://platform.openai.com/docs/pricing
        # gpt-5.6-sol pricing is promotional until 2026-11-30; re-check at the
        # next refresh.
        # Refresh: edit the rows between the BEGIN/END markers and re-apply
        # this file.
        # --- BEGIN PRICING TABLE ---

        # Anthropic
        - {record: rhai_api_pricing_mtok, expr: "vector(10)", labels: {provider: anthropic, model: fable-5.1, pair: anthropic/fable-5.1, tier: standard, context: any, token_type: input}}
        - {record: rhai_api_pricing_mtok, expr: "vector(50)", labels: {provider: anthropic, model: fable-5.1, pair: anthropic/fable-5.1, tier: standard, context: any, token_type: output}}
        - {record: rhai_api_pricing_mtok, expr: "vector(0.25)", labels: {provider: anthropic, model: fable-5.1, pair: anthropic/fable-5.1, tier: standard, context: any, token_type: cache_read}}
        - {record: rhai_api_pricing_mtok, expr: "vector(12.50)", labels: {provider: anthropic, model: fable-5.1, pair: anthropic/fable-5.1, tier: standard, context: any, token_type: cache_write}}
