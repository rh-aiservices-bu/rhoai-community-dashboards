apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Short prompt, short reply, modest concurrency - mimics an interactive chat
# workload. Good for exercising TTFT/inter-token latency panels without
# pushing the engine into queueing.

resources:
  - ../../base

configMapGenerator:
  - name: guidellm-config
    behavior: merge
    envs:
      - run.env

secretGenerator:
  - name: guidellm-api-key
    behavior: merge
    envs:
      - secret.env
