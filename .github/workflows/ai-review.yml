name: ai review (manual)

# Reviews a pull request with a model running on our own cluster, instead of
# sending the diff to a third party.
#
# Manual on purpose. CodeRabbit handles review on the pull request path and
# gives line level comments, incremental review on new commits and follow up
# questions, which this cannot. Running both would mean two bots commenting on
# every pull request.
#
# Kept because it keeps a review option entirely on our own infrastructure and
# our own model, which is useful for a demo or when a change should not go to an
# external service.
#
# Run it from the Actions tab, or:
#   gh workflow run "ai review (manual)" -f pr=12

on:
  workflow_dispatch:
    inputs:
      pr:
        description: 'Pull request number to review'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: review on our own model
    runs-on: ubuntu-latest
    # The model reasons before answering and a large diff can take minutes.
    # Bounded so a hung request cannot hold a runner for the default 6 hours.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: collect diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr diff "${{ inputs.pr }}" \
            --repo "${{ github.repository }}" > pr.diff
          printf 'diff bytes: %s\n' "$(wc -c < pr.diff)"

      - name: review
        env:
          MAAS_BASE_URL: ${{ vars.MAAS_BASE_URL }}
          MAAS_MODEL: ${{ vars.MAAS_MODEL }}
          MAAS_API_KEY: ${{ secrets.MAAS_API_KEY }}
        run: |
          {
            printf '<!-- ai-review-marker -->\n'
            printf '## Review on our own model\n\n'
            ./validation/scripts/ai_review.sh pr.diff
          } > review.md
          cat review.md

      - name: post or update comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ inputs.pr }}
        run: |
          existing=$(gh api "repos/${{ github.repository }}/issues/${PR}/comments" \
            --jq '.[] | select(.body | contains("<!-- ai-review-marker -->")) | .id' \
            | head -1)
          if [ -n "$existing" ]; then
            gh api -X PATCH \
              "repos/${{ github.repository }}/issues/comments/${existing}" \
              -F body=@review.md >/dev/null
            printf 'updated comment %s\n' "$existing"
          else
            gh pr comment "$PR" --body-file review.md
            printf 'created new comment\n'
          fi
